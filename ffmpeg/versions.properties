# What :ffmpeg is built from. build.sh, the Gradle build and the licence screen read this file, and CI keys its
# FFmpeg cache on it.

# FFmpeg release the native libraries are built from, and the SHA-256 of its tarball (https://ffmpeg.org/releases/).
FFMPEG_VERSION=9.1
FFMPEG_SHA256=1a4d394ae63d190a526cd052eb4415c156b5c5e2df37efab41a7de0b8fde2433

# Android API level the native libraries are built against: the app's minSdk.
ANDROID_API=29

# AndroidX Media3 release the sources under src/main were copied from. Must equal the app's media3 version.
MEDIA3_VERSION=1.11.1

name: android

# Builds Marquee on every push to main, runs the Swift bridge on an emulator, and publishes a signed
# APK as a GitHub release, which is what Obtainium tracks.
#
# Versioning is derived, never hand-edited:
#   versionName  semver, bumped from the previous `v*` tag by the conventional-commit types since it
#                (a `!`/BREAKING CHANGE bumps major, any `feat` bumps minor, otherwise patch). The
#                first release takes version.properties as it is.
#   versionCode  the repository's commit count, so a later build always out-ranks an earlier one.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override the computed versionName (e.g. 1.4.0)'
        required: false
        type: string

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # The Swift bridge's toolchain. The Android Swift SDK must match the toolchain's version exactly.
  SWIFT_URL: https://download.swift.org/swift-6.4.1-release/ubuntu2404/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-ubuntu24.04.tar.gz
  SWIFT_SHA256: 7d246c7114077ad01dba4ad897628446ada4c489d6c7dbcf39ae3f25cbe17e8b
  SWIFT_ANDROID_SDK_URL: https://download.swift.org/swift-6.4.1-release/android-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_android.artifactbundle.tar.gz
  SWIFT_ANDROID_SDK_SHA256: a356b79f8f1daa6ae3a66f4c556966ca20c0208b3659805cf30a83a0a31d6772
  SWIFT_ANDROID_SDK_ID: swift-6.4.1-RELEASE_android
  # Where the Swift SDK is installed; SwiftPM's default moves with XDG_CONFIG_HOME, which runners set.
  SWIFT_SDKS_PATH: /home/runner/swift-sdks
  NDK_URL: https://dl.google.com/android/repository/android-ndk-r30-linux.zip
  NDK_SHA256: 753611f410d002cfcd3f3dc2ef49aad532089d3180b436c060a90bf0fcb64df2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # What the emulator runs with; the checks script starts it again with the same when it exits mid-run.
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # Full history: versionCode is the commit count and the version bump reads the commits since
          # the previous release tag.
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Cache Swift and the NDK
        id: toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/swift
            ~/swift-sdks
            ~/android-ndk-r30
          key: toolchains-${{ env.SWIFT_SHA256 }}-${{ env.SWIFT_ANDROID_SDK_SHA256 }}-${{ env.NDK_SHA256 }}

      - name: Install Swift and the NDK
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o swift.tar.gz "$SWIFT_URL"
          echo "$SWIFT_SHA256  swift.tar.gz" | sha256sum -c -
          mkdir -p ~/swift
          tar -xzf swift.tar.gz -C ~/swift --strip-components=1
          rm swift.tar.gz
          curl -fsSL -o ndk.zip "$NDK_URL"
          echo "$NDK_SHA256  ndk.zip" | sha256sum -c -
          unzip -q ndk.zip -d ~
          rm ndk.zip
          mkdir -p "$SWIFT_SDKS_PATH"
          ~/swift/usr/bin/swift sdk install "$SWIFT_ANDROID_SDK_URL" --checksum "$SWIFT_ANDROID_SDK_SHA256" \
            --swift-sdks-path "$SWIFT_SDKS_PATH"

      - name: Link the Swift SDK to the NDK
        run: |
          set -euo pipefail
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r30" >> "$GITHUB_ENV"
          bundle="$SWIFT_SDKS_PATH/$SWIFT_ANDROID_SDK_ID.artifactbundle/swift-android"
          # The bundle ships a dangling clang link that stops the setup script; the script makes it anew.
          rm -f "$bundle/swift-resources/usr/lib/swift/clang"
          ANDROID_NDK_HOME="$HOME/android-ndk-r30" "$bundle/scripts/setup-android-sdk.sh"

      - name: Swift host tests
        working-directory: bridge
        run: |
          set -euo pipefail
          # The package's JNI target includes <jni.h>, which the NDK supplies for Android and the JDK here.
          # A scratch path of its own keeps the host build out of the cached Android build in bridge/.build.
          # The diagnostics tests install the process-wide log sink and compare exact journal lines, so a target
          # that logs while they run breaks them: each target gets a process of its own.
          for target in MarqueeDiagnosticsTests MarqueeBridgeTests; do
            swift test --build-system native --scratch-path "$RUNNER_TEMP/swift-host-tests" --filter "$target" \
              -Xcc -I"$JAVA_HOME/include" -Xcc -I"$JAVA_HOME/include/linux"
          done

      - name: Core revision
        id: core
        run: echo "sha=$(git -C core rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the bridge build
        uses: actions/cache@v4
        with:
          path: bridge/.build
          key: bridge-${{ steps.core.outputs.sha }}-${{ hashFiles('bridge/Package.swift', 'bridge/Package.resolved', 'bridge/Sources/**') }}
          restore-keys: bridge-

      - name: Compute version
        id: version
        run: |
          set -euo pipefail

          previous_tag="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
          if [ -n "$previous_tag" ]; then
            base="${previous_tag#v}"
            range="${previous_tag}..HEAD"
          else
            base="$(grep -E '^version=' version.properties | cut -d= -f2 | tr -d '[:space:]')"
            range="HEAD"
          fi

          major="$(echo "$base" | cut -d. -f1)"
          minor="$(echo "$base" | cut -d. -f2)"
          patch="$(echo "$base" | cut -d. -f3)"
          subjects="$(git log --format=%s "$range" || true)"
          bodies="$(git log --format=%B "$range" || true)"

          if [ -z "$previous_tag" ]; then
            version="${major}.${minor}.${patch}"
          elif echo "$bodies" | grep -qE '^BREAKING CHANGE' || echo "$subjects" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
            version="$((major + 1)).0.0"
          elif echo "$subjects" | grep -qE '^feat(\([^)]*\))?:'; then
            version="${major}.$((minor + 1)).0"
          else
            version="${major}.${minor}.$((patch + 1))"
          fi
          if [ -n "${{ inputs.version || '' }}" ]; then
            version="${{ inputs.version }}"
          fi
          version_code="$(git rev-list --count HEAD)"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MARQUEE_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "MARQUEE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          {
            echo "### Changes"
            echo
            if [ -n "$previous_tag" ]; then
              git log --no-merges --format='- %s (%h)' "$range" | head -n 50
            else
              echo "- First release of Marquee for Android."
            fi
            echo
            echo "**versionCode** \`$version_code\` · **minSdk** 29 · **targetSdk** 37"
          } > "$RUNNER_TEMP/release-notes.md"
          echo "Building $version ($version_code), previous tag: ${previous_tag:-none}"

      - name: Record the released version
        if: github.ref == 'refs/heads/main'
        run: |
          printf '# Released app version. CI rewrites this on every release, see\n# .github/workflows/android.yml. Edit by hand only to force a jump.\nversion=%s\n' \
            "${{ steps.version.outputs.version }}" > version.properties

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Emulator checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: bash .github/emulator-checks.sh

      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-screenshots
          path: app/build/review-screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            baselineprofile/build/outputs/
          retention-days: 7

      # The emulator's own crash reports (none means it was killed rather than crashed) and, when it was lost, the
      # guest's log up to that moment.
      - name: Upload emulator crash data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-crash
          path: |
            /tmp/android-runner/**/*.dmp
            ${{ runner.temp }}/emulator-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No release keystore::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with the debug key and is not released."
          fi

      - name: Build release APK
        env:
          MARQUEE_KEYSTORE: ${{ steps.signing.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          MARQUEE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify the APK
        id: apk
        run: |
          set -euo pipefail
          built="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          apk="app/build/outputs/apk/release/marquee-${{ steps.version.outputs.version }}.apk"
          mv "$built" "$apk"
          # Releases carry the arm64 bridge only; an x86_64 library here means the emulator build leaked in.
          abis="$(unzip -l "$apk" | grep -oE 'lib/[^/]+/' | sort -u | tr '\n' ' ')"
          [ "$abis" = "lib/arm64-v8a/ " ] || { echo "Unexpected native libraries: $abis"; exit 1; }
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          size="$(stat -c %s "$apk")"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "APK $(basename "$apk"): $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marquee-${{ steps.version.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit the version bump
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- version.properties; then
            echo "version.properties already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.properties
          # [skip ci] keeps this from re-triggering the workflow it came from.
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Marquee ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
          fail_on_unmatched_files: true

name: Android TV sideload
on:
  push:
    branches: [tv/onn]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: television-${{ github.ref }}
  cancel-in-progress: true
jobs:
  television:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SWIFT_SDKS_PATH: /home/runner/swift-sdks
      ANDROID_NDK_HOME: /home/runner/android-ndk-r30
      SWIFT_SHA: 7d246c7114077ad01dba4ad897628446ada4c489d6c7dbcf39ae3f25cbe17e8b
      SDK_SHA: a356b79f8f1daa6ae3a66f4c556966ca20c0208b3659805cf30a83a0a31d6772
      NDK_SHA: 753611f410d002cfcd3f3dc2ef49aad532089d3180b436c060a90bf0fcb64df2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Prepare runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore pinned cross-compilers
        id: compilers
        uses: actions/cache@v4
        with:
          path: |
            ~/swift
            ~/swift-sdks
            ~/android-ndk-r30
          key: toolchains-${{ env.SWIFT_SHA }}-${{ env.SDK_SHA }}-${{ env.NDK_SHA }}
      - name: Install compilers on cache miss
        if: steps.compilers.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo swift.tgz https://download.swift.org/swift-6.4.1-release/ubuntu2404/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-ubuntu24.04.tar.gz
          echo "$SWIFT_SHA  swift.tgz" | sha256sum -c -
          mkdir -p ~/swift "$SWIFT_SDKS_PATH"; tar xzf swift.tgz -C ~/swift --strip-components=1; rm swift.tgz
          curl -fsSLo ndk.zip https://dl.google.com/android/repository/android-ndk-r30-linux.zip
          echo "$NDK_SHA  ndk.zip" | sha256sum -c -; unzip -q ndk.zip -d ~; rm ndk.zip
          ~/swift/usr/bin/swift sdk install https://download.swift.org/swift-6.4.1-release/android-sdk/swift-6.4.1-RELEASE_android.artifactbundle.tar.gz --checksum "$SDK_SHA" --swift-sdks-path "$SWIFT_SDKS_PATH"
      - name: Set up tools
        run: |
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
          bundle="$SWIFT_SDKS_PATH/swift-6.4.1-RELEASE_android.artifactbundle/swift-android"
          rm -f "$bundle/swift-resources/usr/lib/swift/clang"
          "$bundle/scripts/setup-android-sdk.sh"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.2' 'build-tools;37.0.0' >/dev/null
      - name: Build and inspect the private sideload package
        run: |
          bash ffmpeg/build.sh arm64-v8a armeabi-v7a
          ./gradlew :app:assembleTelevision -Pmarquee.abis=arm64-v8a,armeabi-v7a
          apk=$(find app/build/outputs/apk/television -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
          for abi in arm64-v8a armeabi-v7a; do for lib in MarqueeBridge ffmpegJNI avcodec swresample avutil; do unzip -tqq "$apk" "lib/$abi/lib$lib.so"; done; done
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/badging"
          grep -Fq "package: name='com.nphil.marquee.tv'" "$RUNNER_TEMP/badging"
          grep -Fq 'leanback-launchable-activity:' "$RUNNER_TEMP/badging"
      - uses: actions/upload-artifact@v4
        with:
          name: Marquee-Android-TV
          path: app/build/outputs/apk/television/*.apk
          if-no-files-found: error
      - name: Build the offline TV review version
        run: |
          bash ffmpeg/build.sh x86_64
          if ! command -v ffmpeg >/dev/null || ! /usr/bin/python3 -c 'from PIL import Image'; then
            # Only Ubuntu's media and screenshot tooling is needed for the offline fixtures.
            apt=(sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
            "${apt[@]}" update -qq
            "${apt[@]}" install -y --no-install-recommends ffmpeg python3-pil
          fi
          clip=core/UITests/FakePlex/pms/library/parts/2121/file.mp4.bin
          ffmpeg -v error -f lavfi -i testsrc2=size=320x180:rate=24 -t 146 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -movflags +faststart -f mp4 "$clip"
          metadata=core/UITests/FakePlex/pms/library/metadata
          mkdir -p "$metadata/108"
          people=core/UITests/FakePlex/pms/library/people
          mkdir -p "$people/3001"
          cp core/UITests/FakePlex/pms/library/sections/1/all@actor=3001.json "$people/3001/media.json"
          watchlist=core/UITests/FakePlex/discover/library/sections/watchlist
          jq '.MediaContainer |= (.Metadata |= map(select(.title == "Spring")) | .size = 1 | .totalSize = 1)' "$watchlist/all.json" > "$watchlist/released.json"
          # The review server answers status normally but refuses this fixture profile's Plex sign-in.
          printf '%s\n' '{"__status":403,"message":"Access denied"}' >core/UITests/FakePlex/seerr/api/v1/auth/plex.json
          # A transparent wordmark for the offline title; no network artwork in the review.
          ffmpeg -v error -f lavfi -i "color=c=black@0:s=540x108,format=rgba,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf:text=Sintel:fontsize=86:fontcolor=white:x=0:y=(h-th)/2" -frames:v 1 -threads 1 core/UITests/FakePlex/art/sintel-review-logo.png
          jq '.MediaContainer.Metadata[0].Image = [{"type":"clearLogo","url":"/art/sintel-review-logo.png"}]' "$metadata/108.json" > "$RUNNER_TEMP/title.json"
          cp "$RUNNER_TEMP/title.json" "$metadata/108.json"
          jq '.MediaContainer.Metadata[0] |= (.title = "Sintel Trailer" | .Media[0].Part[0].key = "/library/parts/2121/file.mp4")' "$metadata/105/extras.json" > "$metadata/108/extras.json"
          # Two marked rolls separated by an unmarked tag; only the isolated review package gets this episode.
          episode=core/UITests/FakePlex/pms/library/metadata/212.json
          jq '.MediaContainer.Metadata[0] |= (.Marker += [{"id":21293,"type":"credits","startTimeOffset":80000,"endTimeOffset":95000}] | .Chapter = [
             {"tag":"Opening scene","startTimeOffset":0,"endTimeOffset":35000},
             {"tag":"After the opening","startTimeOffset":35000,"endTimeOffset":80000},
             {"tag":"First roll","startTimeOffset":80000,"endTimeOffset":130000},
             {"tag":"Last roll","startTimeOffset":130000,"endTimeOffset":146000}])' "$episode" > "$RUNNER_TEMP/episode.json"
          cp "$RUNNER_TEMP/episode.json" "$episode"
          ./gradlew :app:assembleNonMinifiedRelease -Pmarquee.abis=x86_64 -Pmarquee.tvReview=true
      - name: Drive the TV with remote keys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          disable-animations: false
          ram-size: 3072M
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim
          script: bash .github/television-review.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TV-remote-review
          path: app/build/tv-review
          if-no-files-found: warn

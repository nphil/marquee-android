org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

kotlin.code.style=official

# ABIs the Swift bridge is built for and the APK carries. Releases ship arm64-v8a only; the CI
# emulator job passes -Pmarquee.abis=x86_64.
marquee.abis=arm64-v8a
